# Gates de qualidade (RNF-QA-01..09) e de segurança (SEC-DEV-02).
# Alterações neste arquivo exigem revisão humana (doc 12 §9, CODEOWNERS).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, arquitetura, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Esquema Drizzle sem migração pendente
        run: |
          pnpm --filter @zooloo/db-schema db:generate
          test -z "$(git status --porcelain packages/db-schema/migrations)" || {
            echo "::error::O esquema Drizzle mudou sem migração. Rode 'pnpm --filter @zooloo/db-schema db:generate' e versione o resultado."
            git status --porcelain packages/db-schema/migrations
            exit 1
          }
      - name: OpenAPI versionado igual ao gerado
        run: |
          pnpm build
          pnpm --filter @zooloo/api openapi
          git diff --exit-code apps/api/openapi.json || {
            echo "::error::A API mudou e o openapi.json não. Rode 'pnpm build && pnpm --filter @zooloo/api openapi' e versione o resultado."
            exit 1
          }

  mutation:
    name: Mutação do núcleo financeiro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mutation

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: SCA (dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --prod --audit-level high

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
